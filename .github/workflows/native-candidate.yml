name: Native release candidate

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      notarize-preview:
        required: false
        default: false
        type: boolean
      profile:
        required: false
        default: auto
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Candidate version, for example 2.0.0-rc.1'
        required: true
        type: string
      notarize-preview:
        description: 'Sign/notarize preview Mac artifacts when Apple credentials are configured'
        required: false
        default: false
        type: boolean
      profile:
        description: 'Target set: auto selects Linux for stable versions and all four for previews'
        required: false
        default: auto
        type: choice
        options: [auto, linux, mac-arm, all]

# Produces reviewable artifacts only. Stable publication requires all release acceptance gates.
permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      build-id: ${{ steps.identity.outputs.build-id }}
      notarize: ${{ steps.identity.outputs.notarize }}
      profile: ${{ steps.identity.outputs.profile }}
      matrix: ${{ steps.identity.outputs.matrix }}
    steps:
      - id: identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NOTARIZE_PREVIEW: ${{ inputs.notarize-preview }}
          RELEASE_PROFILE: ${{ inputs.profile }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^2\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          echo "build-id=native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          profile=$RELEASE_PROFILE
          if [[ "$profile" == auto ]]; then
            if [[ "$RELEASE_VERSION" == *-* ]]; then profile=all; else profile=linux; fi
          fi
          if [[ "$RELEASE_VERSION" != *-* && "$profile" != linux ]]; then
            echo 'Stable 2.0.0 supports only the two Linux targets' >&2
            exit 1
          fi
          case "$profile" in
            linux)
              matrix='{"include":[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-musl","key":"linux-amd64"},{"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl","key":"linux-arm64"}]}' ;;
            mac-arm)
              [[ "$RELEASE_VERSION" == *-* ]] || exit 1
              matrix='{"include":[{"runner":"macos-15","target":"aarch64-apple-darwin","key":"darwin-arm64"}]}' ;;
            all)
              [[ "$RELEASE_VERSION" == *-* ]] || exit 1
              matrix='{"include":[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-musl","key":"linux-amd64"},{"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl","key":"linux-arm64"},{"runner":"macos-15-intel","target":"x86_64-apple-darwin","key":"darwin-amd64"},{"runner":"macos-15","target":"aarch64-apple-darwin","key":"darwin-arm64"}]}' ;;
            *) echo "Unknown release profile: $profile" >&2; exit 1 ;;
          esac
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [[ "$profile" != linux && "$NOTARIZE_PREVIEW" == true ]]; then
            echo 'notarize=true' >> "$GITHUB_OUTPUT"
          else
            echo 'notarize=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: identity
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.identity.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GRIDSTATOR_BUILD_ID: ${{ needs.identity.outputs.build-id }}
      GRIDSTATOR_SOURCE_REVISION: ${{ github.sha }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_KEY: ${{ matrix.key }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Stamp native version and install pinned build tools
        run: |
          node native/scripts/set-version.mjs "$RELEASE_VERSION"
          cd native
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain "$toolchain" "$RELEASE_TARGET"
      - name: Install Linux build-host C compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check native sources and build on the actual target host
        working-directory: native
        env:
          CC: ${{ runner.os == 'Linux' && 'musl-gcc' || 'cc' }}
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --target "$RELEASE_TARGET" -- -D warnings
          cargo test --locked --all-targets --target "$RELEASE_TARGET" -- --test-threads=1
          cargo build --locked --release --target "$RELEASE_TARGET"
          mkdir -p "candidate/$RELEASE_KEY"
          cp "target/$RELEASE_TARGET/release/gridstator" "candidate/$RELEASE_KEY/gridstator"
      - name: Sign and notarize the final Mac executable
        if: runner.os == 'macOS' && needs.identity.outputs.notarize == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE_P12:?Missing Developer ID certificate}"
          : "${APPLE_SIGNING_IDENTITY:?Missing Developer ID identity}"
          : "${APPLE_ID:?Missing notary Apple ID}"
          : "${APPLE_TEAM_ID:?Missing Apple team ID}"
          : "${APPLE_APP_PASSWORD:?Missing notary app password}"
          keychain="$RUNNER_TEMP/gridstator-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          cleanup() { security delete-keychain "$keychain" || true; rm -f "$RUNNER_TEMP/gridstator.p12"; }
          trap cleanup EXIT
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/gridstator.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/gridstator.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          binary="native/candidate/$RELEASE_KEY/gridstator"
          codesign --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          ditto -c -k "$binary" "$RUNNER_TEMP/gridstator-notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/gridstator-notarization.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --output-format json > "native/candidate/$RELEASE_KEY/notarization.json"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["status"] == "Accepted"' "native/candidate/$RELEASE_KEY/notarization.json"
      - name: Record final executable identity and linkage
        run: |
          binary="native/candidate/$RELEASE_KEY/gridstator"
          "$binary" build-info --json > "native/candidate/$RELEASE_KEY/build-info.json"
          "$binary" --version
          file "$binary"
          if [[ "$RUNNER_OS" == Linux ]]; then
            readelf -l -d "$binary" > "native/candidate/$RELEASE_KEY/linkage.txt"
            if grep -Eq 'INTERP|NEEDED' "native/candidate/$RELEASE_KEY/linkage.txt"; then echo 'Linux release must be static' >&2; exit 1; fi
            docker run --rm --network none --mount "type=bind,src=$GITHUB_WORKSPACE/$binary,dst=/gridstator,readonly" \
              alpine:3.21 /gridstator build-info --json > "native/candidate/$RELEASE_KEY/clean-runtime.json"
            jq -e --arg target "${RELEASE_KEY/-/\/}" '.target == $target' \
              "native/candidate/$RELEASE_KEY/clean-runtime.json"
          else
            otool -L "$binary" > "native/candidate/$RELEASE_KEY/linkage.txt"
            if grep -Eiq 'lib(sqlite3|ssl|crypto|node)[.-]' "native/candidate/$RELEASE_KEY/linkage.txt"; then exit 1; fi
          fi
      - name: Exercise isolated user and system service lifecycle with final Linux bytes
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/native/candidate/$RELEASE_KEY/gridstator"
          proof_dir="native/candidate/$RELEASE_KEY"
          test_binary=$(find "native/target/$RELEASE_TARGET/debug/deps" -maxdepth 1 -name 'systemd_e2e-*' -type f -executable -print -quit)
          test -n "$test_binary"
          uid=$(id -u)
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$uid.service"
          export XDG_RUNTIME_DIR="/run/user/$uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user show-environment > /dev/null
          GRIDSTATOR_TEST_BINARY="$binary" "$test_binary" --ignored --exact \
            actual_systemd_supervisor_controller_and_embedded_worker_lifecycle --nocapture \
            2>&1 | tee "$proof_dir/systemd-user.log"
          sudo env GRIDSTATOR_TEST_BINARY="$binary" GRIDSTATOR_SYSTEMD_SCOPE=system \
            "$GITHUB_WORKSPACE/$test_binary" --ignored --exact \
            actual_systemd_supervisor_controller_and_embedded_worker_lifecycle --nocapture \
            2>&1 | tee "$proof_dir/systemd-system.log"
          jq -n --arg runner "$RUNNER_NAME" --arg os "$RUNNER_OS" --arg arch "$RUNNER_ARCH" \
            --arg uname "$(uname -a)" --arg systemd "$(systemctl --version | head -1)" \
            --arg docker "$(docker version --format '{{.Server.Version}}')" \
            --arg executableSha256 "$(sha256sum "$binary" | cut -d' ' -f1)" \
            '{runner:$runner,os:$os,arch:$arch,uname:$uname,systemd:$systemd,docker:$docker,executableSha256:$executableSha256,userScope:"passed",systemScope:"passed"}' \
            > "$proof_dir/systemd-proof.json"
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ matrix.key }}
          path: native/candidate/${{ matrix.key }}/
          if-no-files-found: error

  vscode:
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package the thin Node-based extension requiring the Rust helper
        run: |
          node scripts/set-version.mjs "${RELEASE_VERSION%%-*}"
          pnpm typecheck
          pnpm lint
          pnpm exec vitest run --no-file-parallelism
          pnpm --filter ./apps/vscode package:native
          mv apps/vscode/dist/gridstator-native.vsix "apps/vscode/dist/gridstator-native-$RELEASE_VERSION.vsix"
      - uses: actions/upload-artifact@v7
        with:
          name: native-vscode-candidate
          path: apps/vscode/dist/*.vsix
          if-no-files-found: error

  vscode-integration:
    needs: [identity, build, vscode]
    if: needs.identity.outputs.profile != 'mac-arm'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: candidate-linux-amd64
          path: native/integration-candidate
      - uses: actions/download-artifact@v8
        with:
          name: native-vscode-candidate
          path: apps/vscode/dist
      - name: Exercise the packaged VSIX against the native CLI and isolated worker
        run: |
          chmod +x native/integration-candidate/gridstator
          vsix=$(find "$GITHUB_WORKSPACE/apps/vscode/dist" -maxdepth 1 -name '*.vsix' -print -quit)
          cd apps/vscode
          GRIDSTATOR_NATIVE_CLI_E2E="$GITHUB_WORKSPACE/native/integration-candidate/gridstator" \
            GRIDSTATOR_NATIVE_VSIX="$vsix" \
            xvfb-run -a node test/run-integration.mjs

  assemble:
    needs: [identity, build, vscode, vscode-integration]
    if: always() && needs.identity.result == 'success' && needs.build.result == 'success' && needs.vscode.result == 'success' && (needs.vscode-integration.result == 'success' || needs.identity.outputs.profile == 'mac-arm')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: candidate-*
          path: native/candidate-input
      - name: Normalize artifact directories
        run: |
          shopt -s nullglob
          directories=(native/candidate-input/candidate-*)
          if ((${#directories[@]})); then
            for directory in "${directories[@]}"; do
              name=${directory##*/}
              mv "$directory" "native/candidate-input/${name#candidate-}"
            done
          else
            # download-artifact flattens a pattern when only one artifact matches.
            target=$(jq -er .target native/candidate-input/build-info.json)
            case "$target" in
              linux/amd64|linux/arm64|darwin/amd64|darwin/arm64) ;;
              *) echo "Unexpected candidate target: $target" >&2; exit 1 ;;
            esac
            key=${target/\//-}
            mkdir "native/candidate-input/$key"
            find native/candidate-input -maxdepth 1 -type f -exec mv -t "native/candidate-input/$key" {} +
          fi
      - name: Assemble verified final-byte archives, manifest, checksums and native bundle
        working-directory: native
        env:
          REQUIRE_NOTARIZATION: ${{ needs.identity.outputs.notarize }}
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          assembly_args=(candidate-input release)
          if [[ "$REQUIRE_NOTARIZATION" == true ]]; then assembly_args+=(--require-notarization); fi
          cargo run --locked --example assemble_release -- "${assembly_args[@]}"
          cd release
          sha256sum --check SHA256SUMS
      - uses: actions/download-artifact@v8
        with:
          name: native-vscode-candidate
          path: native/release/
      - name: Include extension checksum
        working-directory: native/release
        run: sha256sum ./*.vsix >> SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: native-release-candidate
          path: native/release/
          if-no-files-found: error
