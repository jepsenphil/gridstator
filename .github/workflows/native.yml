name: Native development

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'apps/vscode/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/native.yml'
      - 'docs/NATIVE_*.md'
  pull_request:
    paths:
      - 'native/**'
      - 'apps/vscode/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/native.yml'
      - 'docs/NATIVE_*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

# Development evidence only. No installation into a live cluster or release publishing.
# Each job runs on its target architecture; cross-compilation is not runtime proof.
jobs:
  native:
    name: Actual host ${{ matrix.release-key }} build, tests and CLI smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            release-key: linux/amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            release-key: linux/arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            release-key: darwin/amd64
          - runner: macos-15
            target: aarch64-apple-darwin
            release-key: darwin/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust from native/rust-toolchain.toml
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain "$toolchain" "$CARGO_BUILD_TARGET"
          rustc -vV
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Native unit and contract tests (no Node or pnpm dependency)
        run: cargo test --locked --all-targets
      - name: Build tested development binary
        run: cargo build --locked --release
      - name: Record actual host and audit runtime linkage
        run: bash scripts/audit-native.sh "target/$CARGO_BUILD_TARGET/release/gridstator" '${{ matrix.release-key }}' evidence
      - uses: actions/upload-artifact@v7
        with:
          name: native-development-${{ matrix.target }}
          path: |
            native/target/${{ matrix.target }}/release/gridstator
            native/evidence/
          if-no-files-found: error
          retention-days: 14
