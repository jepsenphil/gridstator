name: Publish native Linux v2

# Manual only. Linux release acceptance and reviewed candidate must pass.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version, for example 2.0.0
        required: true
        type: string
      candidate_run_id:
        description: Successful native-candidate workflow run with final release bytes
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      candidate-sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require a stable v2 version from main
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$RELEASE_VERSION" =~ ^2\.[0-9]+\.[0-9]+$ ]]
      - name: Resolve a successful candidate from this repository
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > candidate-run.json
          jq -e --arg repository "$GITHUB_REPOSITORY" \
            '.name == "Native release candidate" and .event == "workflow_dispatch" and .conclusion == "success" and .head_repository.full_name == $repository' \
            candidate-run.json
          echo "sha=$(jq -r .head_sha candidate-run.json)" >> "$GITHUB_OUTPUT"
      - name: Require every recorded Linux stable acceptance gate
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: node native/scripts/check-release-acceptance.mjs --release --revision "$GITHUB_SHA" --candidate-revision "$CANDIDATE_SHA"
      - name: Require release notes for this version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const version = process.env.RELEASE_VERSION;
            const headings = fs.readFileSync("CHANGELOG.md", "utf8").split("\n");
            if (!headings.some((line) => line.startsWith(`## [${version}]`) || line.startsWith(`## ${version}`))) {
              console.error(`CHANGELOG.md needs a ${version} release section`);
              process.exit(1);
            }
          '

  publish:
    needs: release-gate
    runs-on: ubuntu-24.04
    environment: v2-release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download the reviewed candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name native-release-candidate --dir release
      - name: Verify the assembled release identity and bytes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ needs.release-gate.outputs.candidate-sha }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          jq -e --arg version "$RELEASE_VERSION" --arg revision "$CANDIDATE_SHA" \
            '.version == $version and .sourceRevision == $revision and (.artifacts | keys | sort) == ["linux/amd64", "linux/arm64"]' \
            gridstator-release.json
          test "$(find . -maxdepth 1 -name '*.vsix' | wc -l)" -eq 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ needs.release-gate.outputs.candidate-sha }}
        run: |
          node scripts/changelog-section.mjs "$RELEASE_VERSION" > release-notes.md
          gh release create "v$RELEASE_VERSION" release/* --draft --target "$CANDIDATE_SHA" \
            --title "Gridstator v$RELEASE_VERSION" --notes-file release-notes.md
      - name: Promote the verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release edit "v$RELEASE_VERSION" --draft=false
