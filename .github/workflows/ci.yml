name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ACT_VERSION: 0.2.97

jobs:
  check:
    name: Typecheck, lint, unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  e2e:
    name: End-to-end (Docker, BuildKit, act)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install act (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/nektos/act/releases/download/v${ACT_VERSION}/act_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/nektos/act/releases/download/v${ACT_VERSION}/checksums.txt"
          grep " act_Linux_x86_64.tar.gz$" checksums.txt | sha256sum -c -
          tar -xzf act_Linux_x86_64.tar.gz act
          sudo install -m 0755 act /usr/local/bin/act
          act --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e

  vscode:
    name: VS Code extension (webview UI + integration)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter gridstator-vscode exec playwright install --with-deps chromium
      - run: pnpm test:ui
      - run: pnpm test:vscode

  package:
    name: Bundle and pack
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack:release
      - name: Smoke-test the packed CLI
        run: |
          npm install -g --prefix "$RUNNER_TEMP/gst" apps/cli/release/gridstator-*.tgz
          "$RUNNER_TEMP/gst/bin/gridstator" --version
          "$RUNNER_TEMP/gst/bin/gridstator" --help
      - run: pnpm package:vscode
      - uses: actions/upload-artifact@v7
        with:
          name: gridstator-packages
          path: |
            apps/cli/release/gridstator-*.tgz
            apps/vscode/dist/gridstator.vsix
