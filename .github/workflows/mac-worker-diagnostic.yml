name: Mac worker diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
        shell: bash
    env:
      CARGO_BUILD_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup target add --toolchain "$toolchain" "$CARGO_BUILD_TARGET"
      - name: Repeat offline worker restart test
        run: |
          for attempt in {1..100}; do
            echo "::group::attempt $attempt"
            cargo test --locked --test local_worker_contract \
              private_control_works_offline_and_preserves_pause_and_budget_across_restart \
              -- --exact --nocapture
            echo '::endgroup::'
          done
