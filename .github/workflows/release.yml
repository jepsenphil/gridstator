name: Release

# Legacy v0/v1 CLI security-fix archives only. Native v2 has a separately gated workflow.
on:
  push:
    # v2 uses the separately gated native candidate pipeline; never publish an npm v2 CLI.
    tags: ['v0.*.*', 'v1.*.*']

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stamp the version from the tag
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm pack:release
      - name: Collect release assets
        run: |
          mkdir -p release
          cp apps/cli/release/gridstator-*.tgz release/
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/changelog-section.mjs "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" release/* --title "Gridstator ${GITHUB_REF_NAME}" --notes-file notes.md \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
