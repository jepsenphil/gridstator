[package]
name = "gridstator-desktop"
version = "2.0.0-dev.2"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "Gridstator local worker desktop companion"

[lib]
name = "gridstator_desktop"

[[bin]]
name = "gridstator-desktop"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
custom-protocol = ["tauri/custom-protocol"]
gui = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-autostart", "dep:tauri-plugin-single-instance"]

[dependencies]
anyhow = "1"
auto-launch = "=0.6.0"
dirs = "6"
fs2 = "0.4"
gridstator-local-control-protocol = { path = "../../../native/local-control-protocol" }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "2"
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-autostart = { version = "=2.7.0", optional = true }
tauri-plugin-single-instance = { version = "=2.5.5", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Memory", "Win32_Storage_FileSystem"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
