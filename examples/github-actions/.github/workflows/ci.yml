name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      greeting:
        description: Who to greet in the report
        required: false
        default: world

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=junit.xml
      - name: Write report
        run: |
          mkdir -p report
          echo "Hello ${{ inputs.greeting || 'world' }} from $GITHUB_REPOSITORY@$GITHUB_REF_NAME" > report/summary.txt
          cp junit.xml report/
      - uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report/

  lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting of source files
        run: node -e "require('node:fs').readdirSync('src').forEach(f => console.log('checked', f))"
